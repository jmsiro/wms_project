services:
  app :
    build: .
    container_name: project_app
    restart: always
    volumes:
      - ./project:/project
    stdin_open: true
    tty: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONN: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}
      CONN_TEST: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}_dev

  redis:
    image: redis:7.0
    container_name: project_redis
    restart: always
    ports:
      - 6379:6379
    expose:
      - 6379
    volumes:
      - ./docker_redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 2

  db:
    image: mysql:9.2 
    container_name: project_db
    restart: always
    ports:
      - 3306:3306
    expose:
      - 3306
    volumes:
      - ./docker_db/data:/var/lib/mysql # Volume for persistent data
      - ./docker_db/initdb.d:/docker-entrypoint-initdb.d # Load SQL scripts on startup
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 2

